name: Sync upstream
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: merge
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git remote add upstream https://github.com/atom2ueki/mcp-server-synology.git
          git fetch upstream
          before=$(git rev-parse HEAD)
          git merge upstream/main --no-edit
          git push
          if [ "$before" != "$(git rev-parse HEAD)" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Redeploy Portainer stack
        if: steps.merge.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          curl -fsS -X POST \
            -H "CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}" \
            -H "CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}" \
            "${{ secrets.PORTAINER_WEBHOOK_URL }}"
