name: Sync upstream
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git remote add upstream https://github.com/atom2ueki/mcp-server-synology.git
          git fetch upstream
          git merge upstream/main --no-edit
          git push
